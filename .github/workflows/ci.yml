name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Системные зависимости
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev

      - name: Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Сборка
        run: cargo build --workspace --locked

      - name: Тесты
        run: cargo test --workspace --locked

      - name: Драйвер собирается (ядро раннера Ubuntu)
        run: |
          set -o pipefail
          sudo apt-get install -y linux-headers-$(uname -r)
          # Ядро раннера может быть собрано не тем gcc, что стоит по умолчанию.
          cc=$(sed -n 's/^CONFIG_CC_VERSION_TEXT="\(x86_64-linux-gnu-\)\?\(gcc-[0-9]*\).*/\2/p' \
              /lib/modules/$(uname -r)/build/.config)
          echo "ядро $(uname -r), компилятор ядра: ${cc:-?}"
          [ -z "$cc" ] || command -v "$cc" >/dev/null || sudo apt-get install -y "$cc"
          # Хвост лога — в аннотацию: её видно без входа в GitHub.
          ./scripts/build-driver.sh 2>&1 | tee driver.log || {
              echo "::error title=Сборка драйвера::$(grep -v '^ *\(CC\|LD\|BTF\|MODPOST\)' driver.log | tail -15 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
              exit 1
          }

  driver-fedora:
    # Ядро Fedora новее, чем у Ubuntu LTS: ловим поломки API ядра заранее.
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Заголовки ядра и инструменты
        # git — до checkout, иначе он скачает архив без .git и git diff ниже не сработает.
        run: |
          dnf install -y --setopt=install_weak_deps=False \
              kernel-devel gcc make elfutils-libelf-devel findutils patch git curl

      - uses: actions/checkout@v4

      - name: Драйвер собирается
        run: ./scripts/build-driver.sh "$(ls /usr/src/kernels | sort -V | tail -1)"

      - name: Патчи ложатся на исходники TUXEDO
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/update-driver.sh
          git diff --exit-code -- third_party/tuxedo-drivers
