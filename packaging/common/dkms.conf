# tuxedo-drivers с патчами для MECHREVO (third_party/tuxedo-drivers).
PACKAGE_NAME="openrevo-drivers"
PACKAGE_VERSION="@VERSION@"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
AUTOINSTALL="yes"

BUILT_MODULE_NAME[0]="tuxedo_compatibility_check"
BUILT_MODULE_LOCATION[0]="tuxedo_compatibility_check/"
DEST_MODULE_LOCATION[0]="/extra"

BUILT_MODULE_NAME[1]="tuxedo_keyboard"
DEST_MODULE_LOCATION[1]="/extra"

BUILT_MODULE_NAME[2]="uniwill_wmi"
DEST_MODULE_LOCATION[2]="/extra"

BUILT_MODULE_NAME[3]="clevo_wmi"
DEST_MODULE_LOCATION[3]="/extra"

BUILT_MODULE_NAME[4]="clevo_acpi"
DEST_MODULE_LOCATION[4]="/extra"

BUILT_MODULE_NAME[5]="tuxedo_io"
BUILT_MODULE_LOCATION[5]="tuxedo_io/"
DEST_MODULE_LOCATION[5]="/extra"
