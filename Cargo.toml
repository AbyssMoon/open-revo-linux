[workspace]
resolver = "2"
members = ["crates/openrevo-core", "crates/openrevod", "crates/openrevo-cli", "crates/openrevo-gui"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
openrevo-core = { path = "crates/openrevo-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
